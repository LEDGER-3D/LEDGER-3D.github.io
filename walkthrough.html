// ---------------------------------------------------------------- stage helpers

// a simple orbiting 3D view of the kitchen (z up) for steps 4-8

function sTag(t, k) {

  const tags = D.frames[FI].tags; let cx = B.x + 850, cy = B.y + 100;

function sLift(t, k) {                                                // 3D boxes in the (undistorted) frame, then the boxes' centres fly into the world

let allDets = [];
function sCluster(t, k) {                                             // every lifted sighting in 3D, coloured by label, pulled together into clusters

  text("same label + close in 3D", STAGE.x + 1250, STAGE.y + 400, 22, "#cfd3da", 500); text("= one cluster", STAGE.x + 1250, STAGE.y + 432, 22, "#cfd3da", 500);

function sTrack(t, k) {                                               // clusters of the same object under different names merge

const posAt = (o, t) => { const tr = o.traj; if (!tr.length || t < tr[0][0]) return null; let p = tr[0]; for (const q of tr) { if (q[0] > t) break; p = q; } return p.slice(1); };
