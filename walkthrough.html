function sLift(t, k) {                                                // 3D boxes in the (undistorted) frame, then the boxes' centres fly into the world

let allDets = [];
function sCluster(t, k) {                                             // every lifted sighting in 3D, coloured by label, pulled together into clusters
  Object.assign(V3, { x: STAGE.x, y: STAGE.y, w: 1180, h: 760 }); panel(V3.x, V3.y, V3.w, V3.h, ""); const ang = 0.6 + t * 0.06, c = ease(span(k, 0.25, 0.8));

  text("same label, close to the", STAGE.x + 1250, STAGE.y + 400, 22, "#cfd3da", 500); text("object's latest position", STAGE.x + 1250, STAGE.y + 432, 22, "#cfd3da", 500); text("= the same object", STAGE.x + 1250, STAGE.y + 464, 22, "#cfd3da", 500);
}

const posAt = (o, t) => { const tr = o.traj; if (!tr.length || t < tr[0][0]) return null; let p = tr[0]; for (const q of tr) { if (q[0] > t) break; p = q; } return p.slice(1); };
